<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Feedback & Review</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .dashboard-card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      text-align: center;
      border: 1px solid #e2e8f0;
      animation: cardFadeIn 0.4s ease-out;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stars-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .star {
      font-size: 38px;
      cursor: pointer;
      display: inline-block;
      animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .star:nth-child(1) { animation-delay: 0.08s; }
    .star:nth-child(2) { animation-delay: 0.16s; }
    .star:nth-child(3) { animation-delay: 0.24s; }
    .star:nth-child(4) { animation-delay: 0.32s; }
    .star:nth-child(5) { animation-delay: 0.40s; }

    .star:hover, .star:active {
      transform: scale(1.22);
    }

    @keyframes starPop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .shop-title {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.25;
      word-wrap: break-word;
    }

    .subtitle {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 26px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: all 0.2s ease;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      color: #1e293b;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-positive:hover {
      border-color: #22c55e;
      background-color: #f0fdf4;
    }

    .option-negative:hover {
      border-color: #f97316;
      background-color: #fff7ed;
    }

    .arrow {
      font-size: 18px;
      color: #94a3b8;
      font-weight: 700;
    }

    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .popup-box {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: starPop 0.35s ease-out;
    }

    .popup-stars {
      font-size: 36px;
      margin-bottom: 12px;
      letter-spacing: 4px;
    }

    .popup-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .popup-text {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 18px;
    }

    .feedback-input {
      width: 100%;
      height: 90px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      resize: none;
      outline: none;
    }

    .feedback-input:focus {
      border-color: #3b82f6;
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
    }

    .close-btn {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <div class="stars-container">
      <span class="star" onclick="handlePositive('5-Star Rating')">⭐</span>
      <span class="star" onclick="handlePositive('5-Star Rating')">⭐</span>
      <span class="star" onclick="handlePositive('5-Star Rating')">⭐</span>
      <span class="star" onclick="handlePositive('5-Star Rating')">⭐</span>
      <span class="star" onclick="handlePositive('5-Star Rating')">⭐</span>
    </div>

    <h1 class="shop-title" id="shopNameDisplay">Welcome!</h1>
    <p class="subtitle">Tap an option below to share your quick experience with us</p>

    <div class="options-grid">
      <!-- 4 Positive Options (Direct to Google Review) -->
      <button class="option-btn option-positive" onclick="handlePositive('Excellent Service & Staff')">
        <span>🌟 Excellent Service & Staff</span>
        <span class="arrow">→</span>
      </button>

      <button class="option-btn option-positive" onclick="handlePositive('Amazing Quality & Taste')">
        <span>✨ Amazing Quality & Experience</span>
        <span class="arrow">→</span>
      </button>

      <button class="option-btn option-positive" onclick="handlePositive('Great Ambience & Vibe')">
        <span>💎 Great Ambience & Cleanliness</span>
        <span class="arrow">→</span>
      </button>

      <button class="option-btn option-positive" onclick="handlePositive('100% Value for Money')">
        <span>🙌 100% Value for Money</span>
        <span class="arrow">→</span>
      </button>

      <!-- 2 Negative Options (Direct to Owner's WhatsApp) -->
      <button class="option-btn option-negative" onclick="openNegativeModal('Slow Service / Wait Time')">
        <span>⏳ Slow Service / Wait Time</span>
        <span class="arrow">→</span>
      </button>

      <button class="option-btn option-negative" onclick="openNegativeModal('Need Improvement in Quality')">
        <span>⚠️ Something Could Be Better</span>
        <span class="arrow">→</span>
      </button>
    </div>

    <p class="footer-note">Powered by Smart Review System</p>
  </div>

  <!-- Positive Star Pop-up Modal -->
  <div class="popup-overlay" id="positiveModal">
    <div class="popup-box">
      <div class="popup-stars">⭐⭐⭐⭐⭐</div>
      <h2 class="popup-title">Thank You! 🎉</h2>
      <p class="popup-text">Redirecting you to Google Maps to post your 5-star review...</p>
      <button class="action-btn" id="continueGoogleBtn">Post on Google Now</button>
    </div>
  </div>

  <!-- Negative Feedback Pop-up Modal (WhatsApp) -->
  <div class="popup-overlay" id="negativeModal">
    <div class="popup-box">
      <h2 class="popup-title">We Value Your Feedback 🙏</h2>
      <p class="popup-text">Tell the owner directly on WhatsApp so we can fix this immediately:</p>
      <textarea class="feedback-input" id="customFeedback" placeholder="Write your feedback here..."></textarea>
      <button class="action-btn" onclick="sendWhatsAppFeedback()">Send Directly to Owner</button>
      <button class="close-btn" onclick="closeModals()">Cancel</button>
    </div>
  </div>

  <script>
    // 1. Read URL Parameters (Supports both new 's, w, m' and old 'shop, wa, g')
    const params = new URLSearchParams(window.location.search);

    const shopName = params.get('s') || params.get('shop') || 'Our Store';
    const rawWa = params.get('w') || params.get('wa') || '';
    const whatsappNumber = rawWa.replace(/[^0-9]/g, '');

    const rawMap = params.get('m') || params.get('g') || '';
    const googleMapsUrl = rawMap
      ? (rawMap.startsWith('http') ? rawMap : `https://maps.app.goo.gl/${rawMap}`)
      : 'https://www.google.com/maps';

    // Set Shop Name on UI
    document.getElementById('shopNameDisplay').textContent = shopName;
    document.title = `${shopName} - Review`;

    let selectedIssue = '';

    // 2. Positive Flow -> Show Star Pop-up & Redirect to Google Maps
    function handlePositive(reason) {
      const modal = document.getElementById('positiveModal');
      modal.style.display = 'flex';

      document.getElementById('continueGoogleBtn').onclick = function () {
        window.location.href = googleMapsUrl;
      };

      setTimeout(() => {
        window.location.href = googleMapsUrl;
      }, 900);
    }

    // 3. Negative Flow -> Open Private Feedback Box for Owner's WhatsApp
    function openNegativeModal(issue) {
      selectedIssue = issue;
      document.getElementById('negativeModal').style.display = 'flex';
    }

    function sendWhatsAppFeedback() {
      const extraNote = document.getElementById('customFeedback').value.trim();
      const message = `Hello *${shopName}*, I visited recently and wanted to share private feedback:\n\n*Issue:* ${selectedIssue}${extraNote ? `\n*Details:* ${extraNote}` : ''}`;

      if (whatsappNumber) {
        window.location.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
      } else {
        alert('Thank you! Your feedback has been noted.');
        closeModals();
      }
    }

    function closeModals() {
      document.getElementById('positiveModal').style.display = 'none';
      document.getElementById('negativeModal').style.display = 'none';
    }
  </script>
</body>
</html>
