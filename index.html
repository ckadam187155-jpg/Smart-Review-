<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Share your feedback</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: #f4f6f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .card { background: #fff; width: 100%; max-width: 460px; border-radius: 24px; padding: 32px 24px; box-shadow: 0 12px 32px rgba(15,23,42,.08); border: 1px solid #e2e8f0; text-align: center; }
  h1 { font-size: 26px; font-weight: 800; color: #0f172a; margin-bottom: 8px; line-height: 1.25; word-wrap: break-word; }
  .intro { font-size: 15px; color: #475569; line-height: 1.5; margin-bottom: 20px; }
  label { display: block; text-align: left; font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 6px; }
  textarea { width: 100%; height: 110px; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.4; resize: vertical; color: #0f172a; }
  .hint { text-align: left; font-size: 12px; color: #64748b; margin: 6px 0 16px; }
  button { width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; -webkit-tap-highlight-color: transparent; }
  .primary { background: #2563eb; color: #fff; border: none; }
  .secondary { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #2563eb; }
  .ghost { background: #fff; color: #334155; border: 1.5px solid #cbd5e1; font-size: 14px; padding: 12px; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  #status { min-height: 20px; font-size: 14px; font-weight: 600; margin-top: 4px; }
  .ok { color: #15803d; } .err { color: #b91c1c; }
  .note { margin-top: 18px; font-size: 12px; color: #64748b; line-height: 1.4; }
</style>
</head>
<body>
<main class="card">
  <h1 id="shopName">Feedback</h1>
  <p class="intro" id="intro">Thank you for visiting. Your honest feedback helps us improve. You can leave a public Google review or send private feedback to the business. Both options are available to everyone.</p>

  <div id="content" hidden>
    <label for="feedback">Your feedback (optional)</label>
    <textarea id="feedback" maxlength="1000" placeholder="Write about your own experience, in your own words"></textarea>
    <p class="hint">What did you enjoy? What could we improve? Nothing is filled in for you.</p>

    <button type="button" class="primary" id="openGoogle">Open Google review page</button>
    <button type="button" class="secondary" id="sendPrivate">Send private feedback on WhatsApp</button>
    <button type="button" class="ghost" id="copyBtn">Copy my text</button>
