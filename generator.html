<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Link Generator (LOCAL USE ONLY)</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { background: #f4f6f9; padding: 16px; display: flex; justify-content: center; }
  .card { background: #fff; width: 100%; max-width: 480px; border-radius: 20px; padding: 24px; border: 1px solid #e2e8f0; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .warn { font-size: 13px; color: #b91c1c; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  input, textarea { width: 100%; padding: 11px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
  textarea { height: 90px; }
  button { width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; border: none; background: #2563eb; color: #fff; }
  button.alt { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #2563eb; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; }
  #msg { margin-top: 12px; font-size: 14px; font-weight: 600; }
  .ok { color: #15803d; } .err { color: #b91c1c; }
  #result { display: none; margin-top: 16px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
  .small { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<main class="card">
  <h1>Client Link Generator</h1>
  <p class="warn">Local use only. Do not upload this file to GitHub Pages.</p>

  <label for="base">1. Your customer page URL (where index.html is hosted)</label>
  <input id="base" type="url" placeholder="https://yourname.github.io/review/" />

  <label for="shop">2. Business name</label>
  <input id="shop" type="text" maxlength="80" placeholder="e.g. Vellora Cafe and Restro" />

  <label for="cc">3. Country code (digits only)</label>
  <input id="cc" type="tel" value="91" />
